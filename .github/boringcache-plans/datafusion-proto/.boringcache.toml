workspace = "boringcache/datafusion"

[proxy]
metadata-hints = ["project=datafusion", "experiment=issue-25148"]

[entries.cargo-registry-cache]
tag = "datafusion-issue-25148-cargo-v2-registry-cache"

[entries.cargo-registry-index]
tag = "datafusion-issue-25148-cargo-v2-registry-index"

[entries.cargo-git-db]
tag = "datafusion-issue-25148-cargo-v2-git-db"

[entries.cargo-target]
kind = "cargo-target"
tag = "datafusion-issue-25148-cargo-v2-target"

[profiles.cargo]
entries = ["cargo-registry-cache", "cargo-registry-index", "cargo-git-db", "cargo-target"]

[adapters.cargo]
tag = "datafusion-issue-25148-cargo-v2"
no-platform = false
no-git = false
read-only = false
fail-on-cache-error = true
profiles = ["cargo"]
skip-restore = false
skip-save = false
save-on-failure = false
mount-cache = false
compiler-cache = "none"
metadata-hints = ["lane=datafusion-proto"]
command = ["cargo", "xtask", "ci", "step", "check", "datafusion-proto", "default"]
