name: BoringCache DataFusion validation

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Run the uncached baseline, publish one workspace seed, or restore into all feature checks
        type: choice
        options:
          - baseline
          - seed
          - restore
        default: baseline

permissions:
  contents: read

concurrency:
  group: boringcache-datafusion-${{ inputs.phase }}
  cancel-in-progress: false

jobs:
  seed:
    name: Publish workspace check seed
    if: github.repository == 'boringcache/datafusion' && github.ref == 'refs/heads/boringcache-validation' && inputs.phase == 'seed'
    runs-on: ${{ vars.USE_RUNS_ON == 'true' && format('runs-on={0},family=m8a+m7a+c8a,cpu=8,image=ubuntu24-full-x64,extras=s3-cache,disk=large,tag=datafusion', github.run_id) || 'ubuntu-latest' }}
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    container:
      image: amd64/rust
    steps:
      - uses: runs-on/action@efac073ea2507ec18797de3a81704201ade11d9d # v2.3.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-builder
        with:
          rust-version: stable
      - name: Record source and toolchain identity
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/boringcache-validation"
          source_commit=$(cat .github/boringcache-source)
          git diff --exit-code "$source_commit" -- . ':!.boringcache.toml' ':!.github/boringcache-source' ':!.github/workflows/boringcache-connect.yml' ':!.github/workflows/boringcache-validation.yml'
          git rev-parse HEAD > "$RUNNER_TEMP/boringcache-validation/workflow-commit.txt"
          cp .github/boringcache-source "$RUNNER_TEMP/boringcache-validation/upstream-commit.txt"
          cp .boringcache.toml "$RUNNER_TEMP/boringcache-validation/cache-plan.toml"
          rustc -Vv > "$RUNNER_TEMP/boringcache-validation/rustc.txt"
          cargo -V > "$RUNNER_TEMP/boringcache-validation/cargo.txt"
          sha256sum Cargo.lock > "$RUNNER_TEMP/boringcache-validation/cargo-lock.sha256"
      - name: Install sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.17.0
          disable_annotations: true
      - name: Publish the workspace Cargo check
        id: cargo-cache
        uses: boringcache/one@1039999c65011be670f5655e0e48ad556188ab12 # v1.30.4
        with:
          mode: cargo
          trust-policy: publish
          diagnostics: summary
          fail-on-cache-error: true
      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: datafusion-seed
          path: |
            ${{ runner.temp }}/boringcache-validation
            ${{ steps.cargo-cache.outputs.evidence-path }}
          if-no-files-found: error
          retention-days: 30

  datafusion-common:
    name: ${{ inputs.phase }} cargo check datafusion-common features
    if: github.repository == 'boringcache/datafusion' && github.ref == 'refs/heads/boringcache-validation' && (inputs.phase == 'baseline' || inputs.phase == 'restore')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    container:
      image: amd64/rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-builder
        with:
          rust-version: stable
      - name: Record source and toolchain identity
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/boringcache-validation"
          source_commit=$(cat .github/boringcache-source)
          git diff --exit-code "$source_commit" -- . ':!.boringcache.toml' ':!.github/boringcache-source' ':!.github/workflows/boringcache-connect.yml' ':!.github/workflows/boringcache-validation.yml'
          git rev-parse HEAD > "$RUNNER_TEMP/boringcache-validation/workflow-commit.txt"
          cp .github/boringcache-source "$RUNNER_TEMP/boringcache-validation/upstream-commit.txt"
          cp .boringcache.toml "$RUNNER_TEMP/boringcache-validation/cache-plan.toml"
          rustc -Vv > "$RUNNER_TEMP/boringcache-validation/rustc.txt"
          cargo -V > "$RUNNER_TEMP/boringcache-validation/cargo.txt"
          sha256sum Cargo.lock > "$RUNNER_TEMP/boringcache-validation/cargo-lock.sha256"
      - name: Install sccache
        if: inputs.phase == 'restore'
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.17.0
          disable_annotations: true
      - name: Restore shared Cargo and compiler state
        id: cargo-cache
        if: inputs.phase == 'restore'
        uses: boringcache/one@1039999c65011be670f5655e0e48ad556188ab12 # v1.30.4
        with:
          mode: cargo
          trust-policy: restore
          diagnostics: summary
          fail-on-cache-error: true
      - name: Check datafusion-common (default features)
        run: cargo xtask ci step check datafusion-common default
      - name: Check datafusion-common (no-default-features)
        run: cargo xtask ci step check datafusion-common no-default
      - name: Record compiler cache statistics
        if: always() && inputs.phase == 'restore'
        run: sccache --show-stats --stats-format=json > "$RUNNER_TEMP/boringcache-validation/sccache.json"
      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: datafusion-common-${{ inputs.phase }}
          path: |
            ${{ runner.temp }}/boringcache-validation
            ${{ steps.cargo-cache.outputs.evidence-path }}
          if-no-files-found: error
          retention-days: 30

  datafusion-substrait:
    name: ${{ inputs.phase }} cargo check datafusion-substrait features
    if: github.repository == 'boringcache/datafusion' && github.ref == 'refs/heads/boringcache-validation' && (inputs.phase == 'baseline' || inputs.phase == 'restore')
    runs-on: ${{ vars.USE_RUNS_ON == 'true' && format('runs-on={0},family=m8a+m7a+c8a,cpu=16,image=ubuntu24-full-x64,extras=s3-cache,disk=large,tag=datafusion', github.run_id) || 'ubuntu-latest' }}
