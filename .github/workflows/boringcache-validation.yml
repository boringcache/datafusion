      - name: Check datafusion-functions (datetime_expressions)
        run: cargo xtask ci step check datafusion-functions datetime_expressions
      - name: Check datafusion-functions (encoding_expressions)
        run: cargo xtask ci step check datafusion-functions encoding_expressions
      - name: Check datafusion-functions (math_expressions)
        run: cargo xtask ci step check datafusion-functions math_expressions
      - name: Check datafusion-functions (regex_expressions)
        run: cargo xtask ci step check datafusion-functions regex_expressions
      - name: Check datafusion-functions (string_expressions)
        run: cargo xtask ci step check datafusion-functions string_expressions
      - name: Check datafusion-functions (unicode_expressions)
        run: cargo xtask ci step check datafusion-functions unicode_expressions
      - name: Record compiler cache statistics
        if: always() && inputs.phase == 'restore'
        run: sccache --show-stats --stats-format=json > "$RUNNER_TEMP/boringcache-validation/sccache.json"
      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: datafusion-functions-${{ inputs.phase }}
          path: |
            ${{ runner.temp }}/boringcache-validation
            ${{ steps.cargo-cache.outputs.evidence-path }}
          if-no-files-found: error
          retention-days: 30

  datafusion-spark:
    name: ${{ inputs.phase }} cargo check datafusion-spark features
    if: github.repository == 'boringcache/datafusion' && github.ref == 'refs/heads/boringcache-validation' && (inputs.phase == 'baseline' || inputs.phase == 'restore')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    container:
      image: amd64/rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-builder
        with:
          rust-version: stable
      - name: Record source and toolchain identity
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/boringcache-validation"
          source_commit=$(cat .github/boringcache-source)
          git diff --exit-code "$source_commit" -- . ':!.boringcache.toml' ':!.github/boringcache-source' ':!.github/workflows/boringcache-connect.yml' ':!.github/workflows/boringcache-validation.yml'
          git rev-parse HEAD > "$RUNNER_TEMP/boringcache-validation/workflow-commit.txt"
          cp .github/boringcache-source "$RUNNER_TEMP/boringcache-validation/upstream-commit.txt"
          cp .boringcache.toml "$RUNNER_TEMP/boringcache-validation/cache-plan.toml"
          rustc -Vv > "$RUNNER_TEMP/boringcache-validation/rustc.txt"
          cargo -V > "$RUNNER_TEMP/boringcache-validation/cargo.txt"
          sha256sum Cargo.lock > "$RUNNER_TEMP/boringcache-validation/cargo-lock.sha256"
      - name: Install sccache
        if: inputs.phase == 'restore'
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.17.0
          disable_annotations: true
      - name: Restore shared Cargo and compiler state
        id: cargo-cache
        if: inputs.phase == 'restore'
        uses: boringcache/one@1039999c65011be670f5655e0e48ad556188ab12 # v1.30.4
        with:
          mode: cargo
          trust-policy: restore
          diagnostics: summary
          fail-on-cache-error: true
      - name: Check datafusion-spark (default features)
        run: cargo check --profile ci --all-targets -p datafusion-spark
      - name: Check datafusion-spark (no-default-features)
        run: cargo check --profile ci --no-default-features -p datafusion-spark
      - name: Check datafusion-spark (core)
        run: cargo check --profile ci --no-default-features -p datafusion-spark --features=core
      - name: Record compiler cache statistics
        if: always() && inputs.phase == 'restore'
        run: sccache --show-stats --stats-format=json > "$RUNNER_TEMP/boringcache-validation/sccache.json"
      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: datafusion-spark-${{ inputs.phase }}
          path: |
            ${{ runner.temp }}/boringcache-validation
            ${{ steps.cargo-cache.outputs.evidence-path }}
          if-no-files-found: error
          retention-days: 30
